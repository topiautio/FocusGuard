[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "focusguard"
version = "0.1.0"
description = "Local Linux focus-hours website blocker using nftables DNS sets"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [{name = "FocusGuard contributors"}]
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.scripts]
focusguard = "focusguard.cli:main"
focusguard-daemon = "focusguard.daemon:main"
focusguard-nm-dispatcher = "focusguard.nm_dispatcher:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "black>=24"]

[tool.hatch.build.targets.wheel]
packages = ["src/focusguard"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ARG"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
